name: rbac

services:
  backend:
    image: rbac-image
    container_name: rbac-app
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '${NODE_PORT}:${NODE_PORT}'
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: '4GB'
    mem_limit: '4g'
    cpus: '1.0'
